name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    with:
      features: "*"
      macos: true
      # `ikigai-engine` is documented as compiling to wasm32 — ikigai-web-demo runs the
      # kernel in a browser — and until now nothing checked it. It does not hold for the
      # whole workspace (quinn, tokio, the transports), so the job is scoped to the one
      # member that claims it, under its DEFAULT features: the plan reader's Turtle stack
      # pulls getrandom, which does not build for wasm32, and that is exactly why it is
      # behind `plan-reader` rather than unconditional.
      wasm-lib: true
      wasm-packages: "ikigai-engine"
  # The workspace's one rule for a request-derived name joined under a directory
  # (`ikigai_resolve::is_plain_file_name`, ledger #1307) is the WINDOWS rule applied on every
  # platform, and its premise (`Path::join("C:x")` REPLACES the base) only holds on Windows.
  # This job is where that premise is observed rather than cited: the resolve crate's
  # file-name tests, including the `cfg(windows)` one, on a Windows runner. Scoped to that
  # one crate's lib tests on purpose: nothing else here is built on Windows yet (that is the
  # Windows track), and ikigai-resolve needs only ikigai-core, so this stays cheap. The
  # `home` filter adds the shared `~` rule's tests (ledger #1379), whose `~\x` case differs
  # by platform.
  # ⚠ Inline cargo beside the shared caller: ci-drift reads this repo as `caller+inline`.
  windows-file-names:
    name: file-name rule (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ikigai-resolve --lib -- file_name home
  # The native Windows PROBE (ledger #1162): what breaks when the whole workspace is built and
  # tested on Windows. It REPORTS and does not gate: both cargo steps carry
  # `continue-on-error: true`, so a red step leaves the job (and the PR) green. Ledger #1162 is
  # the item that turns this into a gate, once `docs/windows.md`'s map is worked down; until
  # then a gate here would block every PR on day one. So that it is never a probe that
  # silently passes (field guide 9c), the last step writes each cargo step's outcome to the job
  # summary and raises a `::warning::` annotation for every one that failed.
  # The build takes the binary's install features (`quic,web`) and `--keep-going`, so one
  # failing crate does not hide the next one's errors; `--no-fail-fast` does the same for test.
  # ⚠ Inline cargo beside the shared caller, like `windows-file-names` above.
  windows-probe:
    name: native build probe (Windows, non-gating)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-probe
      - id: build
        name: cargo build -p ikigai-cli --features quic,web
        continue-on-error: true
        run: cargo build -p ikigai-cli --locked --features quic,web --keep-going
      - id: test
        name: cargo test --workspace
        continue-on-error: true
        run: cargo test --workspace --locked --no-fail-fast
      - name: report the probe's outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows probe (ledger #1162, non-gating)"
            echo ""
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| build -p ikigai-cli --features quic,web | ${{ steps.build.outcome }} |"
            echo "| test --workspace | ${{ steps.test.outcome }} |"
            echo ""
            echo "The breakage map is docs/windows.md."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::warning title=Windows probe::cargo build -p ikigai-cli --features quic,web failed on Windows (non-gating; ledger #1162, docs/windows.md)"
          fi
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "::warning title=Windows probe::cargo test --workspace failed on Windows (non-gating; ledger #1162, docs/windows.md)"
          fi
