name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    with:
      features: "*"
      macos: true
      # `ikigai-engine` is documented as compiling to wasm32 — ikigai-web-demo runs the
      # kernel in a browser — and until now nothing checked it. It does not hold for the
      # whole workspace (quinn, tokio, the transports), so the job is scoped to the one
      # member that claims it, under its DEFAULT features: the plan reader's Turtle stack
      # pulls getrandom, which does not build for wasm32, and that is exactly why it is
      # behind `plan-reader` rather than unconditional.
      wasm-lib: true
      wasm-packages: "ikigai-engine"
  # The workspace's one rule for a request-derived name joined under a directory
  # (`ikigai_resolve::is_plain_file_name`, ledger #1307) is the WINDOWS rule applied on every
  # platform, and its premise (`Path::join("C:x")` REPLACES the base) only holds on Windows.
  # This job is where that premise is observed rather than cited: the resolve crate's
  # file-name tests, including the `cfg(windows)` one, on a Windows runner. Scoped to that
  # one crate's lib tests on purpose: nothing else here is built on Windows yet (that is the
  # Windows track), and ikigai-resolve needs only ikigai-core, so this stays cheap. The
  # `home` filter adds the shared `~` rule's tests (ledger #1379), whose `~\x` case differs
  # by platform.
  # ⚠ Inline cargo beside the shared caller: ci-drift reads this repo as `caller+inline`.
  windows-file-names:
    name: file-name rule (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ikigai-resolve --lib -- file_name home
  # The native Windows PROBE (ledger #1162): what breaks when the whole workspace is built and
  # tested on Windows, and what the built binary does there. It REPORTS and does not gate:
  # every probe step carries `continue-on-error: true`, so a red step leaves the job (and the
  # PR) green. Ledger #1162 is the item that turns this into a gate, once `docs/windows.md`'s
  # map is worked down; until then a gate here would block every PR on day one. So that it is
  # never a probe that silently passes (field guide 9c), the last step writes each step's
  # outcome to the job summary and raises a `::warning::` annotation for every one that did
  # not pass.
  # The build takes the binary's install features (`quic,web`) and `--keep-going`, so one
  # failing crate does not hide the next one's errors; `--no-fail-fast` does the same for test.
  # ⚠ Inline cargo beside the shared caller, like `windows-file-names` above.
  windows-probe:
    name: native build probe (Windows, non-gating)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-probe
      - id: build
        name: cargo build -p ikigai-cli --features quic,web
        continue-on-error: true
        run: cargo build -p ikigai-cli --locked --features quic,web --keep-going
      # Smoke the binary that step built (quic,web), in the order docs/windows.md's map is
      # ordered by. Every cli integration test is `cfg(unix)`, so nothing else runs the binary
      # on Windows.
      # 1. `--version` and a local `-c` from PowerShell with HOME UNSET, as a native Windows shell
      #    has it (Git Bash sets HOME; cmd and PowerShell set USERPROFILE instead).
      - id: local
        name: smoke - --version and a local -c (PowerShell, no HOME)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $ikigai = Join-Path $PWD 'target\debug\ikigai.exe'
          & $ikigai --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ikigai --quiet -c 'source urn:host:identity'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 2. The remote path a collaborator would use: a QUIC door (`ikigai serve quic://`) and a
      #    one-shot client that reaches it through an --override mount, in a scratch home. The
      #    door binds port 0 and the client reads the bound port off its banner.
      - id: quic
        name: smoke - a QUIC door and an ikigai -c client through it
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          ikigai="$PWD/target/debug/ikigai.exe"
          scratch="$RUNNER_TEMP/iwp"
          mkdir -p "$scratch/config/ikigai"
          export HOME="$scratch" XDG_CONFIG_HOME="$scratch/config" IKIGAI_FILES="$scratch/files"
          "$ikigai" cert generate --dir "$scratch/certs" </dev/null
          "$ikigai" serve quic://127.0.0.1:0 --name win --cert-dir "$scratch/certs" </dev/null 2>"$scratch/door.log" &
          door=$!
          for _ in $(seq 1 240); do
            grep -q 'serving on' "$scratch/door.log" && break
            sleep 0.5
          done
          cat "$scratch/door.log"
          address=$(sed -n 's/.*serving on \([^ ]*\).*/\1/p' "$scratch/door.log" | head -n 1)
          echo "door address: $address"
          status=0
          "$ikigai" --quiet --override "urn:host:=$address" --cert-dir "$scratch/certs" \
            -c 'source urn:host:identity' </dev/null || status=$?
          kill "$door" || true
          exit "$status"
      # Last of the cargo steps: it rebuilds target\debug\ikigai.exe under the DEFAULT features
      # (no quic), so the smoke steps above run first.
      - id: test
        name: cargo test --workspace
        continue-on-error: true
        run: cargo test --workspace --locked --no-fail-fast
      - name: report the probe's outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows probe (ledger #1162, non-gating)"
            echo ""
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| build -p ikigai-cli --features quic,web | ${{ steps.build.outcome }} |"
            echo "| test --workspace | ${{ steps.test.outcome }} |"
            echo "| smoke: --version and a local -c, no HOME | ${{ steps.local.outcome }} |"
            echo "| smoke: QUIC door and a -c client | ${{ steps.quic.outcome }} |"
            echo ""
            echo "The breakage map is docs/windows.md."
          } >> "$GITHUB_STEP_SUMMARY"
          report() {
            if [ "$2" != "success" ]; then
              echo "::warning title=Windows probe::$1 did not pass on Windows: $2 (non-gating; ledger #1162, docs/windows.md)"
            fi
          }
          report "cargo build -p ikigai-cli --features quic,web" "${{ steps.build.outcome }}"
          report "cargo test --workspace" "${{ steps.test.outcome }}"
          report "the local smoke (--version, -c, no HOME)" "${{ steps.local.outcome }}"
          report "the QUIC smoke (door and -c client)" "${{ steps.quic.outcome }}"
