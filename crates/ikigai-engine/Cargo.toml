[package]
name = "ikigai-engine"
description = "Renderer-agnostic REPL engine for ikigai: parses a request line, drives a Backend, and reports the result as an Action. Shared by the CLI and the browser frontend."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ikigai-core = { workspace = true }
ikigai-resolve = { workspace = true }
# The process vocabulary (`ik:Process`/`ik:Step`/`ik:Argument`/`ik:Fork`) and the one
# place the plan IRI scheme is coded — `plan.rs` builds every skolem IRI through it
# rather than re-spelling `urn:plan:{id}:step:{n}` and drifting from the published terms.
ikigai-vocab = { workspace = true }
serde_json = { workspace = true }
# Parsing the instant in `as-of=<instant>` (RFC 3339) and naming the corridor for it. Parse
# and format only: no `clock` feature, so nothing here can read the wall clock — the corridor's
# clock is DERIVED from the instant the caller wrote — and nothing wasm-hostile comes with it.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Reading a stored plan back — see `[features].plan-reader` below for why it is optional.
# oxttl is the Turtle parser the rest of the ecosystem's RDF already sits on; oxrdf comes
# with it, because oxttl yields `oxrdf::Triple` and re-exports none of those types, and
# oxttl pins `oxrdf = "=0.3.4"`, so the pin here is that exact version.
oxttl = { workspace = true, optional = true }
oxrdf = { workspace = true, optional = true }
# The bound on a plan's triple-term nesting (ledger #992): a plan is caller Turtle, and in a
# build with RDF 1.2 on (this workspace, through rudof) oxttl and oxrdf copy and drop a nested
# triple term recursively, so a few thousand levels of `<<( … )>>` aborted the host at every
# plan door. `ikigai_store::depth::check_rdf_nesting` is the scan that mirrors oxttl's STRICT
# Turtle lexer, which is how `TurtleParser::new()` parses a plan. Its API floor is 0.2.10; the
# version is the root's and `ikigai-intray`'s so the pins cannot resolve apart. No features:
# `persistent` (RocksDB) is the host's, and nothing here opens a store. Optional with the
# reader, so a wasm build (plan-reader off) does not get oxigraph.
ikigai-store = { version = "0.2.21", optional = true }
# Only for the `RdfFormat` that scan takes (the store re-exports none of oxigraph's io types),
# so it is the store's own oxigraph line. Without default features: the default is RocksDB.
oxigraph = { version = "0.5", default-features = false, optional = true }
# block_on + join_all for the parallel fork/map path. Only block_on/join_all are
# used (no ThreadPool), so the engine still compiles to wasm; without an injected
# spawner the parallel path is never taken (sequential fallback).
futures = { workspace = true }

[features]
# ★ OFF by default, and that is the point: this crate is documented as compiling to
# wasm32-unknown-unknown (ikigai-web-demo runs the kernel in a browser), and reading a
# plan back pulls oxrdf → `rand` → `getrandom`, which **fails to compile** on
# wasm32-unknown-unknown without a rustflag only the final consumer can set. Rendering a
# plan (`plan <spec>`) costs nothing and is always available; executing a stored one
# (`run <spec>`) needs the parser, so it is a feature the host asks for — `ikigai-cli`
# does. A wasm build keeps the default and gets a `run` that says which feature is off,
# rather than a build that does not link.
#
# Measured 2026-09-13, not assumed: `cargo check -p ikigai-engine --target
# wasm32-unknown-unknown` passes on main and failed with these deps unconditional. The
# `wasm32 lib clippy` job in ci.yml now runs exactly that, so the claim is a gate.
default = []
plan-reader = ["dep:oxttl", "dep:oxrdf", "dep:ikigai-store", "dep:oxigraph"]

[dev-dependencies]
# End-to-end `sink`/`source`/`cap` tests mount the real file module.
ikigai-fs = { workspace = true }
# The plan round-trip validates every rendered `ik:Process` graph against the published
# shapes (`ikigai_vocab::SHAPES`). A renderer that emits a shape-invalid plan must fail the
# build here, not the reader out there — and `ikigai-vocab` parses its shapes for SYNTAX
# only, so the real validator has to come from somewhere.
ikigai-shacl = { workspace = true }
serde_json = { workspace = true }
# The module recipe as one test over the plan space (`tests/conformance.rs`, plan-reader
# only). 0.8.0 is the floor for `Suite::own` (the walk is scoped to the plan doors and the
# test's stub; `shacl-validate` is inherited, not walked) and REQUIRED; 0.6.0 brought
# SPACE-NAME, the check that `plan_space::space()` claims `urn:iki:space:engine:plan` over the
# same doors on every call. ⚠ `^0.8.0` is also a ceiling below 0.9.0.
# 0.9.0 (ledger #1547): REQUIRED probes input groups through `ActionSpec::check`, OUTPUTS honors `output_from`,
# open argument sets and empty enumerations are understood. ⚠ `^0.9.0` is also a ceiling below 0.10.0.
# 0.9.1 (ledger #1882): VALIDATE's hint allows an optional binding's default (core 0.1.106). Not an API floor.
# ⚠ `^0.9.1` is also a ceiling below 0.10.0.
# 0.10.0 (ledger #1546): the FAILURES check (declared failure classes = produced, core 0.1.108's
# `ActionSpec::fails` over `Error::class()`), opt-in through `Suite::check_failures()` in 0.10 and the
# default from 0.11.0; `Suite::fails_under` probes. ⚠ `^0.10.0` is also a ceiling below 0.11.0.
ikigai-conformance = "0.10.0"
