[package]
name = "ikigai-tz"
description = "Timezone conversion module: urn:tz:convert (IANA/DST-correct) + urn:tz:now (zoned clock)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ikigai-core = { workspace = true }
# Datetime arithmetic + RFC 3339 parse/format. `clock` for Utc::now/Local; no serde.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The IANA time-zone database (bundled) — DST- and offset-correct conversions.
chrono-tz = "0.10"

[dev-dependencies]
futures = { workspace = true }
# The module recipe as one test (`tests/conformance.rs`). 0.8.0 is the floor for REQUIRED,
# which found `urn:tz:convert` refusing a missing `in` untyped (fixed in `src/lib.rs`); 0.6.0
# brought SPACE-NAME, the check that `space()` claims `urn:iki:space:tz` over the same doors
# on every call. ⚠ `^0.8.0` is also a ceiling below 0.9.0.
ikigai-conformance = "0.8.0"
